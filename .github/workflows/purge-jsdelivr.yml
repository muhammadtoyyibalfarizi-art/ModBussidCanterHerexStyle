name: Auto Purge jsDelivr
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Purge files on jsDelivr
        run: |
          REPO="muhammadtoyyibalfarizi-art/ModBussidCanterHerexStyle"
          BRANCH="main"
          purge_file() {
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$1")
            URL="https://purge.jsdelivr.net/gh/$REPO@$BRANCH/$ENCODED"
            echo "Purging: $URL"
            curl -s "$URL"
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            find . -type f -not -path "./.git/*" -not -path "./.github/*" -print0 | while IFS= read -r -d '' file; do
              purge_file "${file#./}"
            done
          else
            git diff --name-only HEAD^ HEAD | while IFS= read -r file; do
              if [ -f "$file" ]; then
                purge_file "$file"
              fi
            done
          fi
